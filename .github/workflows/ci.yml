name: CI

# Every commit on every branch, every pull request against main, and the push
# that lands when a pull request is merged into main.
#
# Tag pushes deliberately do not match: `branches:` never matches a tag ref, so
# cutting a release cannot start a second pipeline for the commit it just built.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede the previous run for the same branch or PR. A branch that also has
# an open PR gets one run per event in two separate groups, so neither run can
# cancel the other's checks out from under branch protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # The whole build, on every commit: fetch and prove the cross-compiler, build
  # the musl sysroot, cross-build make, stage what ships and pack it.
  #
  # One job rather than several because every step depends on the tree the
  # previous one left behind, and this build is fast enough that splitting it
  # would cost more in artifact shuttling than it saved.
  #
  # Most of the wall-clock is the cross-toolchain download, not the compile.
  #
  # `release.yml` is triggered by hand, but it looks for a successful run of
  # this workflow on the commit being released and refuses to publish without
  # one - so this job is the gate a release passes.
  # -------------------------------------------------------------------------
  build:
    name: cross-build make
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The container the sibling repositories build in. Releases are cut on
    # Linux because the cross-toolchain vendor - and therefore the binary -
    # differs by build host, so CI builds on the host that cuts the release.
    #
    # NOTE: on Linux the Makefile takes bootlin's toolchain, where a
    # development machine takes messense's. This workflow is the first thing
    # that has ever exercised that path; the build was verified on macOS.
    container: debian:trixie-slim
    steps:
      # Before checkout on purpose: without git in the container,
      # actions/checkout silently falls back to downloading a tarball.
      #
      # Deliberately short. There is no host compiler in this list and none is
      # needed: musl and make are both built entirely by the downloaded cross
      # toolchain, and nothing in this build has to run on the runner. That is
      # a direct consequence of building the release tarball rather than a git
      # checkout - the autotools and gettext would be here otherwise.
      #
      # xz-utils is not optional: bootlin ships its toolchain as .tar.xz and
      # `make dist` packs with xz -9.
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            make git curl ca-certificates xz-utils

      - uses: actions/checkout@v5

      - name: Fetch the cross-toolchain
        run: make toolchain

      # Checked rather than assumed, and checked before anything expensive: a
      # toolchain for the wrong host extracts happily and then fails to exec,
      # and one for the wrong target compiles happily and produces the wrong
      # binaries.
      - name: Prove it builds C against musl
        run: make toolchain-check

      - name: Download the GNU make sources
        run: make sources

      - name: Check the sources against the pinned digest
        run: make verify-downloads

      # musl.libc.org is unreliable from a container - ../llvm measured four
      # consecutive single-shot fetches failing - which is why the Makefile's
      # curl carries --retry-all-errors.
      - name: Build the musl sysroot
        run: make sysroot

      - name: Prove C links dynamically against it
        run: make sysroot-check

      # `make make`: the aggregate goal is named after the product, as the
      # siblings' are. This is ./configure followed by upstream's ./build.sh.
      - name: Cross-build make
        run: make make

      - name: Stage what ships
        run: make stage

      # Reads the staged tree back: aarch64, on the musl loader, and depending
      # on nothing the card does not have.
      - name: Verify the staged tree
        run: make stage-check

      # Run here too, so the release path is exercised on every commit rather
      # than for the first time during a release.
      - name: Pack the release asset
        run: make dist

      - name: What was built
        run: make toolchain-info sources-info sysroot-info build-info stage-info dist-info

      # Unlike the siblings, whose assets are tens of megabytes, this one is
      # ~112 KB. Uploading it from every branch is nearly free and is the only
      # way anyone gets a build onto a real board - which is still the one
      # thing neither this workflow nor the Makefile can prove.
      - uses: actions/upload-artifact@v5
        with:
          name: sepiaos-make
          path: dist/
          compression-level: 0
          if-no-files-found: error

      # configure and build.sh are noisy and only interesting when they fail,
      # so the Makefile sends them to a log and surfaces only the tail. The
      # full logs are what a failure actually needs.
      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build/src/*/configure.log
            build/src/*/build.log
            build/musl/*/configure.log
            build/musl/*/build.log
          if-no-files-found: ignore
